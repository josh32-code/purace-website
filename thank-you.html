    <!-- Order confirmation tracking — reads ?source=order&product=NAME&price=49 set by Stripe redirect -->
    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var source  = params.get('source');
            var product = params.get('product');
            var price   = parseFloat(params.get('price')) || 49;

            if (source === 'order') {
                // Update page copy for order confirmation
                var heading    = document.querySelector('.thank-you-content h1');
                var paragraphs = document.querySelectorAll('.thank-you-content p');
                if (heading)      heading.textContent = 'Order Confirmed!';
                if (paragraphs[0]) paragraphs[0].textContent = 'Thank you for your Puracé order' + (product ? ' — ' + product : '') + '. You will receive a confirmation email from Stripe shortly.';
                if (paragraphs[1]) paragraphs[1].textContent = 'Your order is being prepared with care. Expect delivery within 3–7 business days.';

                // GA4 purchase event via GTM dataLayer
                window.dataLayer = window.dataLayer || [];
                dataLayer.push({ ecommerce: null });
                dataLayer.push({
                    event: 'purchase',
                    ecommerce: {
                        transaction_id: 'stripe_' + Date.now(),
                        currency: 'AUD',
                        value: price,
                        items: [{ item_name: product || 'Puracé Facial Oil', item_brand: 'Puracé', item_category: 'Facial Oil', price: price, quantity: 1 }]
                    }
                });

                // Meta Pixel purchase event
                if (typeof fbq === 'function') {
                    fbq('track', 'Purchase', { content_name: product || 'Puracé Facial Oil', content_type: 'product', value: price, currency: 'AUD', num_items: 1 });
                }

                // Klaviyo placed order event
                if (typeof _learnq !== 'undefined') {
                    _learnq.push(['track', 'Placed Order', { OrderValue: price, ItemNames: [product || 'Puracé Facial Oil'] }]);
                }
            }
        })();
    </script>
